name: Release

# v{X}.{Y}.{Z} 태그를 올리면 wheel·sdist를 빌드·검사하고 PyPI에 게시한 뒤 GitHub Release를 만든다.
# 패키징 파일을 바꾼 PR에서는 빌드·검사까지만 실행한다.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - Makefile
      - src/queue/queue.mk
      - python/totedb/_native.py
      - tests/package_smoke.py
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare tag, Python and C header versions
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/totedb/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$IS_TAG" != true ]; then tag="$python_version"; fi
          header_version=$(sed -n 's/^#define TOTE_VERSION "\(.*\)"$/\1/p' include/totedb.h)
          echo "tag=$tag python=$python_version header=$header_version"
          test "$tag" = "$python_version"
          test "$tag" = "$header_version"
          grep -q "^## $tag " CHANGELOG.md

  sdist:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and check that it builds the library on install
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdist-env/bin/python "$GITHUB_WORKSPACE/tests/package_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test wheels
        run: |
          python -m pip install "cibuildwheel>=3,<4" twine
          python -m cibuildwheel --output-dir wheelhouse
          python -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-pypi:
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/totedb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version " 'index($0, head) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
