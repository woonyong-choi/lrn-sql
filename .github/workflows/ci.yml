name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test with ASAN and UBSAN
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make test-all

  pg-compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: compat_test
          POSTGRES_USER: compat
          POSTGRES_PASSWORD: compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compat -d compat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Compare SQL behavior with PostgreSQL 18
        env:
          PGCOMPAT_DSN: postgresql://compat:compat@localhost:5432/compat_test
        run: |
          make SANITIZE= BUILD_DIR=build-pg build-pg/sql_probe
          python3 tests/pg_compat.py --probe ./build-pg/sql_probe --require-postgres

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Daphnis figures and generated SVG
        run: |
          npm exec --yes --package=daphnis@0.1.3 -- daphnis check docs/assets/sql-*.dap --strict --no-deprecated
          mkdir -p build/figures
          npm exec --yes --package=daphnis@0.1.3 -- daphnis render docs/assets/sql-*.dap --strict --out build/figures
          for source in docs/assets/sql-*.dap; do
            name="${source##*/}"
            cmp "docs/assets/${name%.dap}.svg" "build/figures/${name%.dap}.svg"
          done

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
